function promptBuild(S,body,hook){
  const ASK=hook.ask||'첫 허들을 같이 넘는 수업, 소개 화면으로 만들어 줘', STEPS=hook.steps||['화면을 만드는 중'];
  const step=k=>{ as.lastElementChild.textContent=STEPS[Math.min(k,STEPS.length-1)]; };
  stage.innerHTML=`<div class="hero d-out">
    <div class="a-prompt center" id="ap"><span class="a-typed"><span id="at"></span><i class="caret"></i></span><span class="a-send"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg></span></div>
    <p class="a-status" id="as"><i></i><span>화면을 만드는 중</span></p>
    <div class="a-build" id="ab"><div class="real">${body}</div><div class="wire" aria-hidden="true">${body}</div><i class="scan"><b>AI</b></i></div>
  </div>`;
  const ap=$('#ap'), at=$('#at'), as=$('#as'), ab=$('#ab'), real=ab.querySelector('.real'), wire=ab.querySelector('.wire'), scan=ab.querySelector('.scan');
  if(hook.wire) hook.wire(wire);
  wire.querySelectorAll('.ln>span,.t').forEach((el,k)=>el.style.setProperty('--i',k));
  const finish=()=>{ real.style.clipPath='none'; wire.style.display='none'; scan.style.display='none'; if(hook.doneText===null) as.classList.remove('on'); else { as.classList.add('on','done'); as.lastElementChild.textContent='이 화면도 AI와 함께 만들었습니다'; } if(hook.done) hook.done(real); };
  if(RM){ at.textContent=ASK; ap.classList.remove('center'); ap.classList.add('ready','sent'); ab.classList.add('on'); finish(); return; }

  /* 한글이 자판으로 조합되는 모습 그대로 */
  const CHO='ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ'; const frames=[]; let done='';
  for(const ch of ASK){ const code=ch.charCodeAt(0)-0xAC00;
    if(code>=0&&code<11172){ const cho=Math.floor(code/588), jung=Math.floor(code%588/28), jong=code%28;
      frames.push(done+CHO[cho]); frames.push(done+String.fromCharCode(0xAC00+cho*588+jung*28)); if(jong) frames.push(done+ch); }
    else frames.push(done+ch);
    done+=ch; }
  let k=0;
  const type=()=>{ if(!S.alive) return; at.textContent=frames[k++]; if(k<frames.length) S.after(15+Math.random()*20,type); else typed(); };
  S.after(300,type);
  function typed(){
    ap.classList.add('ready');
    S.after(260,()=>{ ap.classList.add('sent'); ap.classList.remove('center'); step(0); as.classList.add('on'); });
    S.after(850,()=>{ ab.classList.add('on'); step(1); });
    S.after(1550,()=>{ step(2);
      const o={duration:1300,easing:'cubic-bezier(.45,0,.3,1)',fill:'forwards'};
      real.animate([{clipPath:'inset(0 0 100% 0)'},{clipPath:'inset(0 0 0 0)'}],o);
      wire.animate([{clipPath:'inset(0 0 0 0)'},{clipPath:'inset(100% 0 0 0)'}],o);
      scan.animate([{top:'0%',opacity:1},{top:'100%',opacity:1}],o);
      if(hook.scan) hook.scan(real);
      S.after(1350,()=>{ scan.animate([{opacity:1},{opacity:0}],{duration:300,fill:'forwards'}); S.after(300,finish); });
    });
  }
};
function blobsRun(S){
  const B=[...document.querySelectorAll('#blobs i')].map((el,k)=>({el,x:0,y:0,vx:0,vy:0,ks:[.38,-.22,.55,-.34,.3,.42][k],kx:[.06,-.09,.05,.1,-.07,.08][k],kp:[26,-34,44,-28,36,-40][k],ph:k*1.7}));
  if(RM){ B.forEach(b=>b.el.style.transform=''); return ()=>{}; }
  let px=.5,py=.5;
  const mv=e=>{ px=e.clientX/innerWidth; py=e.clientY/innerHeight; };
  const dn=e=>{ B.forEach(b=>{ const r=b.el.getBoundingClientRect(), cx=r.left+r.width/2, cy=r.top+r.height/2, d=Math.hypot(cx-e.clientX,cy-e.clientY)||1, f=Math.min(30,6000/d); b.vx+=(cx-e.clientX)/d*f; b.vy+=(cy-e.clientY)/d*f; }); };
  addEventListener('pointermove',mv,{passive:true}); addEventListener('pointerdown',dn,{passive:true});
  (function f(now){ if(!S.alive) return; const t=now/1000, s=window.scrollY;
    B.forEach(b=>{ const tx=s*b.kx+(px-.5)*b.kp*2+Math.sin(t*.35+b.ph)*14, ty=-s*b.ks+(py-.5)*b.kp*2+Math.cos(t*.3+b.ph)*12;
      b.vx+=(tx-b.x)*.035; b.vy+=(ty-b.y)*.035; b.vx*=.86; b.vy*=.86; b.x+=b.vx; b.y+=b.vy;
      b.el.style.transform=`translate(-50%,-50%) translate3d(${b.x.toFixed(1)}px,${b.y.toFixed(1)}px,0)`; });
    requestAnimationFrame(f); })(performance.now());
  return ()=>{ removeEventListener('pointermove',mv); removeEventListener('pointerdown',dn); };
}
function introD(S){
  const bub=t=>`<div class="row"><span class="typing3" aria-hidden="true"><i></i><i></i><i></i></span><p class="bub"><span class="t">${t}</span></p></div>`;
  const lead=`<p class="lead">${LEAD_LINES.slice(3).map(l=>l?`<span class="t">${l}</span><br>`:'<br>').join('')}</p>`;

  let lines=[];
  promptBuild(S,body,{
    ask:'1:1 부스터 클래스 소개 화면 만들어 줘', steps:['요청 분석 중','레이아웃 설계 중','렌더링 중'], doneText:null,
    wire(w){ w.querySelector('.figure').innerHTML=''; },
    scan(real){ real.firstElementChild.classList.add('play'); S.after(900,()=>spark(real)); },
    done(real){ const h=real.firstElementChild; if(RM) h.classList.add('still'); h.classList.add('boost');

      const rows=[...real.querySelectorAll('.row')];
      if(RM){ rows.forEach(r=>r.classList.add('in')); lines.forEach(el=>el.classList.remove('pre')); }
      else {
        /* 말풍선과 아래 글은 스크롤해서 '아래 버튼 띠 위'로 올라왔을 때 시작. 위치를 직접 재서 판단 */
        const chat=real.querySelector('.chat'), bar=$('#bar'), pending=[chat,...lines];
        const check=()=>{ if(!S.alive) return; const lim=innerHeight-bar.offsetHeight; let batch=0;
          for(let k=0;k<pending.length;k++){ const el=pending[k], r=el.getBoundingClientRect();
            if(!(el===chat ? r.bottom<=lim-14 : r.top<=lim-40)) continue; pending.splice(k--,1);
            if(el===chat) rows.forEach((row,q)=>{ S.after(150+q*950,()=>row.classList.add('typing')); S.after(700+q*950,()=>{ row.classList.remove('typing'); row.classList.add('in'); }); });
            else { el.style.transitionDelay=(batch++*70)+'ms'; el.classList.remove('pre'); } } };
        let tick=false; const onScroll=()=>{ if(tick) return; tick=true; requestAnimationFrame(()=>{ tick=false; check(); }); };
        addEventListener('scroll',onScroll,{passive:true}); addEventListener('resize',onScroll);
        S.unwatch=()=>{ removeEventListener('scroll',onScroll); removeEventListener('resize',onScroll); };
        check();
      }
      real.querySelector('.figure').addEventListener('click',()=>spark(real)); }
  });
  stage.querySelectorAll('.real .dots .w,.real .dots .n,.real .dots .cap').forEach(t=>{ const x=+t.getAttribute('x'), y=+t.getAttribute('y'); t.setAttribute('transform',`translate(${x} ${y}) scale(1 1.16) translate(${-x} ${-y})`); });
  /* 말풍선 아래 글은 처음부터 숨겨 두고, 완성된 뒤 화면에 들어온 줄부터 나타남 */
  if(!RM){ lines=[...stage.querySelectorAll('.real .lead .t,.real .sign .t')]; lines.forEach(el=>el.classList.add('sr','pre')); }
  const off=blobsRun(S);
  return ()=>{ off(); if(S.unwatch) S.unwatch(); };
};

function warp(then){
  const wc=$('#warp'), d=Math.min(devicePixelRatio||1,2), W=innerWidth, Hh=innerHeight; wc.width=W*d; wc.height=Hh*d;
  const x=wc.getContext('2d'); x.setTransform(d,0,0,d,0,0);
  const b=next.getBoundingClientRect(), ox=b.left+b.width/2, oy=b.top+b.height/2, maxR=Math.hypot(W,Hh);
  const cols=[C.blue,C.peri,C.pink,C.sky,C.white];
  const rays=Array.from({length:110},()=>({a:-Math.PI*Math.random(),s:.35+Math.random()*.65,c:cols[Math.random()*cols.length|0],w:1+Math.random()*2.2}));
  const t0=performance.now(); let gone=false;
  (function f(now){ const p=clamp((now-t0)/750), e=p*p;

  const fail=()=>showFallback('지금은 제출되지 않았습니다. 작성한 답변은 그대로 남아 있습니다.');
  const done=()=>{ submitted=true; try{localStorage.removeItem(KEY)}catch(e){} render(); window.scrollTo({top:0,behavior:'instant'}); };
  const payload=Object.assign({},A,{version:'v3'});
  try{
    if(window.google&&google.script&&google.script.run){
      /* 구글 주소로 열었을 때 */
      google.script.run.withSuccessHandler(done).withFailureHandler(fail).submitResponse(payload);
    } else {
      /* 다른 주소(예: 깃허브 페이지)에 올린 화면에서 열었을 때: 같은 시트로 보냄 */
      fetch(SAVE_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)})
        .then(r=>r.json()).then(j=>{ if(j&&j.ok) done(); else fail(); }).catch(fail);
    }
  }catch(e){ fail(); }
}
let navLock=0;
$('#homeBtn').addEventListener('click',()=>{ if(submitted){ submitted=false; } dir=-1; i=0; save(); render(); window.scrollTo({top:0,behavior:'instant'}); });
next.addEventListener('click',()=>{
  if(Date.now()<navLock) return; /* a tap right after auto-advance must not skip the next question */
  const st=STEPS[i];
  if(st.type==='review'){
    if(submitted){ submitted=false; i=1; render(); window.scrollTo({top:0,behavior:'instant'}); return; }
    if(next.dataset.mode==='copied'){ delete next.dataset.mode; submitted=true; render(); window.scrollTo({top:0,behavior:'instant'}); return; }
    submit(); return;
  }
  if(!valid(st)) return; go(1);
});
back.addEventListener('click',()=>{ if(i>0) go(-1); });
/* Swipe: follows the finger, right = back, left = next (when answered) */
(function(){
  let sx=0,sy=0,dx=0,t0=0,on=false,lock=null,hist=[];
  stage.addEventListener('pointerdown',e=>{ if(e.pointerType==='mouse'||e.target.closest('input,textarea')) return; on=true;lock=null;sx=e.clientX;sy=e.clientY;dx=0;hist=[[e.clientX,e.timeStamp]]; });
  stage.addEventListener('pointermove',e=>{ if(!on) return; const mx=e.clientX-sx,my=e.clientY-sy;
    if(lock===null){ if(Math.abs(mx)<10&&Math.abs(my)<10) return; lock=Math.abs(mx)>Math.abs(my)*1.2?'x':'y'; if(lock==='x'){try{stage.setPointerCapture(e.pointerId)}catch(_){} stage.classList.add('drag');} }
    if(lock!=='x') return;
    const canBack=i>0&&!(STEPS[i].type==='review'&&submitted), canNext=valid(STEPS[i])&&STEPS[i].type!=='review';
    let x=mx; if((x>0&&!canBack)||(x<0&&!canNext)){ const d=window.innerWidth; x=(x*d*.55)/(d+.55*Math.abs(x)); x*=.35; }
    dx=x; stage.style.transform='translateX('+x+'px)'; stage.style.opacity=String(1-Math.min(Math.abs(x)/600,.4));
    hist.push([e.clientX,e.timeStamp]); if(hist.length>5) hist.shift(); });
  const end=()=>{ if(!on) return; on=false; if(lock!=='x'){return;}
    const a=hist[0],b=hist[hist.length-1]; const v=(b[1]-a[1])>0?(b[0]-a[0])/(b[1]-a[1])*1000:0;
    const proj=dx+(v/1000)*0.99/(1-0.99);
    const canBack=i>0&&!(STEPS[i].type==='review'&&submitted), canNext=valid(STEPS[i])&&STEPS[i].type!=='review';
    stage.classList.remove('drag');
    stage.style.transform='';stage.style.opacity='';
    if(proj>110&&canBack){ go(-1); } else if(proj<-110&&canNext){ go(1); }
    else { stage.classList.add('settle'); stage.style.transform='translateX('+dx+'px)'; requestAnimationFrame(()=>{stage.style.transform='';}); setTimeout(()=>stage.classList.remove('settle'),380); }
    lock=null; };
  stage.addEventListener('pointerup',end); stage.addEventListener('pointercancel',end);
  /* a swipe should not count as a tap on an option */
  stage.addEventListener('click',e=>{ if(Math.abs(dx)>10){ e.stopPropagation(); e.preventDefault(); dx=0; } },true);
})();
/* 마우스를 따라다니는 빛 */
(function(){ const c=$('#cur'); if(!c||!matchMedia('(hover:hover) and (pointer:fine)').matches) return;
  let tx=0,ty=0,x=0,y=0,run=false,seen=false;
  const loop=()=>{ x+=(tx-x)*.16; y+=(ty-y)*.16; c.style.transform='translate3d('+x.toFixed(1)+'px,'+y.toFixed(1)+'px,0)';
    if(Math.abs(tx-x)+Math.abs(ty-y)>.3) requestAnimationFrame(loop); else run=false; };
  addEventListener('pointermove',e=>{ if(e.pointerType&&e.pointerType!=='mouse') return; tx=e.clientX; ty=e.clientY;
    if(!seen){ seen=true; x=tx; y=ty; } c.classList.add('on'); if(!run){ run=true; requestAnimationFrame(loop); } },{passive:true});
  document.addEventListener('mouseleave',()=>c.classList.remove('on'));
})();
document.addEventListener('keydown',e=>{ if(e.key==='Enter'&&e.target.tagName==='INPUT'&&!next.disabled){e.preventDefault();next.click();} });
render();
})();
